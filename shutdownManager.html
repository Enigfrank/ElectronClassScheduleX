<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定时关机管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-brand-background: #0f6cbd;
            --color-brand-background-hover: #115ea3;
            --color-brand-foreground: #ffffff;
            --color-neutral-background-1: #ffffff;
            --color-neutral-background-2: #fafafa;
            --color-neutral-background-3: #f5f5f5;
            --color-neutral-foreground-1: #242424;
            --color-neutral-foreground-2: #616161;
            --color-neutral-foreground-3: #808080;
            --color-neutral-stroke-1: #d1d1d1;
            --color-neutral-stroke-2: #e0e0e0;
            --color-status-success-background: #107c10;
            --color-status-danger-background: #c50f1f;
            --color-status-warning-background: #f7630c;
            --shadow-4: 0 0 2px rgba(0,0,0,0.12), 0 2px 4px rgba(0,0,0,0.14);
            --shadow-8: 0 0 2px rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.14);
            --shadow-16: 0 0 2px rgba(0,0,0,0.12), 0 8px 16px rgba(0,0,0,0.14);
            --border-radius-small: 4px;
            --border-radius-medium: 8px;
            --border-radius-large: 12px;
            --font-family-base: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            font-family: var(--font-family-base);
            background: linear-gradient(135deg, #0f6cbd 0%, #286ebd 50%, #3a8bd8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--color-neutral-background-1);
            border-radius: var(--border-radius-large);
            box-shadow: var(--shadow-16);
            width: 100%;
            max-width: 520px;
            padding: 32px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--color-neutral-stroke-2);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--color-neutral-foreground-1);
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-size: 12px;
            color: var(--color-neutral-foreground-3);
            margin-bottom: 4px;
        }

        .header .hint {
            font-size: 13px;
            color: var(--color-neutral-foreground-2);
            background: var(--color-neutral-background-3);
            padding: 8px 12px;
            border-radius: var(--border-radius-medium);
            display: inline-block;
            margin-top: 8px;
        }

        .time-list {
            max-height: 320px;
            overflow-y: auto;
            margin-bottom: 24px;
            border: 1px solid var(--color-neutral-stroke-1);
            border-radius: var(--border-radius-medium);
            background: var(--color-neutral-background-2);
            padding: 12px;
        }

        .time-list::-webkit-scrollbar {
            width: 8px;
        }

        .time-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .time-list::-webkit-scrollbar-thumb {
            background: var(--color-neutral-stroke-1);
            border-radius: 4px;
        }

        .time-list::-webkit-scrollbar-thumb:hover {
            background: var(--color-neutral-foreground-3);
        }

        .time-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: var(--color-neutral-background-1);
            border-radius: var(--border-radius-medium);
            border: 1px solid var(--color-neutral-stroke-2);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .time-item:last-child {
            margin-bottom: 0;
        }

        .time-item:hover {
            box-shadow: var(--shadow-4);
            transform: translateY(-1px);
        }

        .time-item.disabled {
            opacity: 0.6;
            background: var(--color-neutral-background-3);
        }

        .time-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--color-brand-background);
        }

        .time-text {
            font-size: 15px;
            font-weight: 500;
            color: var(--color-neutral-foreground-1);
        }

        .time-text.disabled {
            color: var(--color-neutral-foreground-3);
            text-decoration: line-through;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--color-status-danger-background);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: var(--border-radius-small);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background: rgba(197, 15, 31, 0.1);
            transform: scale(1.05);
        }

        .delete-btn svg {
            width: 18px;
            height: 18px;
        }

        .input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .time-input {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--color-neutral-stroke-1);
            border-radius: var(--border-radius-medium);
            background: var(--color-neutral-background-1);
            color: var(--color-neutral-foreground-1);
            font-family: var(--font-family-base);
            transition: all 0.2s ease;
        }

        .time-input:focus {
            outline: none;
            border-color: var(--color-brand-background);
            box-shadow: 0 0 0 3px rgba(15, 108, 189, 0.15);
        }

        .time-input::placeholder {
            color: var(--color-neutral-foreground-3);
        }

        .add-btn {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            color: var(--color-brand-foreground);
            background: var(--color-brand-background);
            border: none;
            border-radius: var(--border-radius-medium);
            cursor: pointer;
            font-family: var(--font-family-base);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn:hover {
            background: var(--color-brand-background-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-4);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .add-btn svg {
            width: 16px;
            height: 16px;
        }

        .error-message {
            padding: 12px 16px;
            background: rgba(197, 15, 31, 0.1);
            color: var(--color-status-danger-background);
            border-radius: var(--border-radius-medium);
            font-size: 14px;
            display: none;
            animation: fadeInOut 3s forwards;
            border-left: 3px solid var(--color-status-danger-background);
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            10% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--color-neutral-foreground-3);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>定时关机时间设置</h1>
            <p class="subtitle">By Enigfrank</p>
            <p class="hint">建议设置下课后一分钟<br>例如：12:10下课，则设置12:11</p>
        </div>

        <div class="time-list" id="shutdownList">
            <!-- 动态生成时间项 -->
        </div>

        <div class="input-section">
            <input type="text" id="newTime" class="time-input" placeholder="输入时间 (HH:mm)" required autofocus>
            <button class="add-btn" id="addTime">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                添加时间
            </button>
        </div>

        <div class="error-message" id="errorMessage"></div>
    </div>

<script>
    const { ipcRenderer } = require('electron');

    // UI组件初始化
    const timeList = document.getElementById('shutdownList');
    const newTimeInput = document.getElementById('newTime');
    const addTimeBtn = document.getElementById('addTime');
    const errorMessage = document.getElementById('errorMessage');

    // 加载现有时间
    ipcRenderer.on('shutdownTimesUpdated', (event, times) => {
        updateDisplay(times);
        newTimeInput.focus();
    });

    // 更新显示
    function updateDisplay(times) {
        timeList.innerHTML = '';
        if (times.length === 0) {
            timeList.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <p>暂无定时关机时间</p>
                </div>
            `;
            return;
        }
        times.forEach((timeItem, index) => {
            createTimeItem(timeItem, index);
        });
    }

    // 创建时间项
    function createTimeItem(timeItem, index) {
        const item = document.createElement('div');
        item.className = 'time-item';
        if (!timeItem.enabled) item.classList.add('disabled');

        const timeLeft = document.createElement('div');
        timeLeft.className = 'time-left';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'time-checkbox';
        checkbox.checked = timeItem.enabled;
        checkbox.onchange = () => toggleTime(index);

        const timeText = document.createElement('span');
        timeText.className = 'time-text';
        if (!timeItem.enabled) timeText.classList.add('disabled');
        timeText.textContent = timeItem.time || timeItem;

        timeLeft.appendChild(checkbox);
        timeLeft.appendChild(timeText);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.dataset.index = index;
        deleteBtn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
        `;

        item.appendChild(timeLeft);
        item.appendChild(deleteBtn);
        timeList.appendChild(item);
    }

    // 添加新时间
    addTimeBtn.addEventListener('click', () => {
        const time = newTimeInput.value.trim();
        if (/^\d{2}:\d{2}$/.test(time)) {
            ipcRenderer.send('addShutdownTime', { time, enabled: true });
            newTimeInput.value = '';
            newTimeInput.focus();
        } else {
            showError('请输入正确的时间格式 (HH:mm)');
        }
    });

    // 键盘事件支持
    newTimeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            addTimeBtn.click();
        }
    });

    // 错误提示
    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
        setTimeout(() => {
            errorMessage.style.display = 'none';
            newTimeInput.focus();
        }, 3000);
    }

    // 删除时间
    timeList.addEventListener('click', (e) => {
        if (e.target.classList.contains('delete-btn') || e.target.closest('.delete-btn')) {
            const deleteBtn = e.target.classList.contains('delete-btn') ? e.target : e.target.closest('.delete-btn');
            const index = deleteBtn.dataset.index;
            const timeText = deleteBtn.closest('.time-item').querySelector('.time-text').textContent;

            // 显示确认对话框
            if (confirm(`确定要删除时间 ${timeText} 吗？`)) {
                ipcRenderer.send('deleteShutdownTime', index);
                deleteBtn.closest('.time-item').remove();
            }
        }
    });

    // 切换时间启用/禁用状态
    function toggleTime(index) {
        ipcRenderer.send('toggleShutdownTime', index);
    }

    // 页面加载时聚焦输入框
    window.addEventListener('DOMContentLoaded', () => {
        newTimeInput.focus();
    });
</script>
</body>
</html>
