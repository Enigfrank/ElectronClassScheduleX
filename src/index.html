<!DOCTYPE html>
<html lang="zh-CN" id="html">

<head>
  <title>电子课表</title>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script type="text/javascript" src="shared/weekRotation.js"></script>
  <script type="text/javascript" src="js/index.js"></script>
  <script type="text/javascript" src="js/scheduleBootstrap.js"></script>
  <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>
  <div class="globalContainer" id="globalContainer">
    <div class="classContainer background" id="classContainer" style="position: relative;">
      <!-- 添加 position: relative -->
      <div class="class">加</div>
      <div class="class">载</div>
      <div class="class">中</div>
    </div>

    <!-- countdownContainer 位置由CSS控制 -->
    <div class="countdownContainer" id="countdownContainer">
      <div class="countdowner" id="countdowner">
        <div class="currentClass" id="currentFullName">Loading</div>
        <div class="countdown" id="countdownText">00:00</div>
      </div>
    </div>

    <div class="countdownSidebar sidebar background" id="countdownSidebar"><span id="countdownDays" class="t">000</span>
      <div class="corner">天</div>
    </div>
  </div>
  <div class="miniCountdown" id="miniCountdown">00:00</div>
  <div class="dragBoundaryHint" id="dragBoundaryHint" aria-hidden="true"></div>
  <div class="nextClassHint" id="nextClassHint"></div>
  </div>

</body>


<script>
  const ipcRenderer = window.mainWindowApi;
  let _scheduleConfig = null
  let scheduleConfig = null
  let scheduleData = null
  let globalContainer = document.getElementById('globalContainer')
  let classContainer = document.getElementById('classContainer')
  let countdownContainer = document.getElementById('countdownContainer')
  let countdowner = document.getElementById('countdowner')
  let currentFullName = document.getElementById('currentFullName')
  let countdownText = document.getElementById('countdownText')
  let countdownDays = document.getElementById('countdownDays')
  let miniCountdown = document.getElementById('miniCountdown')
  let countdownSidebar = document.getElementById('countdownSidebar')
  let root = document.querySelector(':root');
  const globalContainerHitTargets = [globalContainer, ...globalContainer.children];
  let isClassCountdown = true
  let isClassHidden = true
  let isCountdownerPositionRetryPending = false

  // 拖动相关变量
  let isDragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let miniCountdownInitialX = 0;
  let miniCountdownInitialY = 0;
   let miniCountdownHasMoved = false;
   let dragFrameId = null;
   let pendingDragPosition = null;
   let dragPointerId = null;
   let dragCaptureTarget = null;

  let lastScheduleData = {
    currentHighlight: {
      index: null,
      type: null,
      fullName: null,
      countdown: null,
      countdownText: null
    },
    scheduleArray: [null, null, null],
    timetable: null,
    divider: [null, null]
  }

  let nextClassHint = document.getElementById('nextClassHint');
  let isHintShown = false; 
  let hintTimer = null; 
  const visibilityTransitionDurationMs = 200;
  const toolbarRestoreDelayMs = 2500;
  const visibilityHideTimers = new WeakMap();

  function setScheduleClass() {
    let classHtml = '';
    for (let i = 0; i < scheduleData.scheduleArray.length; i++) {
      let inner = scheduleData.scheduleArray[i]
      if (scheduleData.scheduleArray[i].indexOf('@') != -1) {
        inner = `<div><div class="classNamePart">${inner.split('@')[0]}</div><div class="subClass">${inner.split('@')[1]}</div></div>`
      }
      if (scheduleData.currentHighlight.index == i) {
        if (scheduleData.currentHighlight.type === 'current')
          classHtml += `<div class="class current" id="highlighted">${inner}</div>`
        else if (scheduleData.currentHighlight.type === 'upcoming')
          classHtml += `<div class="class upcoming" id="highlighted">${inner}</div>`
      }
      else {
        if (scheduleData.currentHighlight.index > i)
          classHtml += `<div class="class elapsed">${inner}</div>`
        else
          classHtml += `<div class="class">${inner}</div>`
      }
      if (scheduleData.divider.indexOf(i) != -1)
        classHtml += '<div class="divider"></div>'
    }
    classContainer.innerHTML = classHtml
  }

  function setBackgroundDisplay() {
    let elements = document.getElementsByClassName('background')
    for (element of elements) {
      element.style.visibility = (scheduleData.currentHighlight.type === 'current' && isClassHidden) ? 'hidden' : 'visible'
    }
  }

  /**
   * 使用统一透明度过渡切换倒计时元素，并跳过重复状态更新。
   * @param {HTMLElement} element - 要切换的元素
   * @param {boolean} show - 是否显示元素
   */
  function toggleElement(element, show) {
      const isVisible = element.classList.contains('fade-element');
      const isHidden = element.classList.contains('fade-hidden');

      if ((show && isVisible) || (!show && (isHidden || element.style.display === 'none'))) {
          return;
      }

      const pendingHideTimer = visibilityHideTimers.get(element);
      if (pendingHideTimer) {
          clearTimeout(pendingHideTimer);
          visibilityHideTimers.delete(element);
      }

      if (show) {
          element.style.display = 'block';
          void element.offsetWidth;
          element.classList.remove('fade-hidden');
          element.classList.add('fade-element');
          
          if (element.id === 'miniCountdown') {
              updateInteractiveRect();
          }
      } else {
          element.classList.add('fade-hidden');
          element.classList.remove('fade-element');
          
          if (element.id === 'miniCountdown') {
              ipcRenderer.send('updateInteractiveRect', null);
          }
          
          const hideTimer = setTimeout(() => {
              if (element.classList.contains('fade-hidden')) {
                  element.style.display = 'none';
              }
              visibilityHideTimers.delete(element);
          }, visibilityTransitionDurationMs);
          visibilityHideTimers.set(element, hideTimer);
      }
  }

  function setCountdownerContent() {
    currentFullName.innerText = scheduleData.currentHighlight.fullName;
    currentFullName.style.color = scheduleData.currentHighlight.type === 'current' ? 'rgba(0, 255, 10, 1)' : 'rgba(255, 255, 5, 1)'
    countdownText.innerText = scheduleData.currentHighlight.countdownText;

    // 核心：检查是否距离下课还有10分钟（600秒）
    if (scheduleData.currentHighlight.type === 'current' && scheduleData.currentHighlight.countdown === 600 && !isHintShown) {
      const nextClass = getNextClassInfo();
      if (nextClass) {
        nextClassHint.innerHTML = `<span class="hint-label">下节</span>: ${nextClass.name}`;
        
        if (!miniCountdownHasMoved) {
          // 1. 未移动过（在原位）：显示在 miniCountdown 右侧
          const miniRect = miniCountdown.getBoundingClientRect();
          nextClassHint.style.left = `${miniRect.right + 10}px`; 
          nextClassHint.style.top = `${miniRect.top}px`; 
          nextClassHint.style.transform = 'none'; // 清除居中变换
        } else {
          // 2. 被移动过：显示在屏幕顶部正中央
          nextClassHint.style.left = '50%';
          nextClassHint.style.top = 'var(--top-space)'; // 保持与初始状态一致的顶部间距
          nextClassHint.style.transform = 'translateX(-50%)'; // 启用水平居中
        }

        // 先移除淡出类，确保可以重新触发淡入动画
        nextClassHint.classList.remove('fadeOut');
        nextClassHint.style.display = 'block';

        // 强制重排，确保动画可以重新触发
        void nextClassHint.offsetHeight;

        isHintShown = true;

        // 15秒后隐藏提示
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => {
          nextClassHint.classList.add('fadeOut'); // 淡出动画
          setTimeout(() => {
            nextClassHint.style.display = 'none';
            nextClassHint.classList.remove('fadeOut');
            isHintShown = false; // 重置状态，允许下次触发
          }, visibilityTransitionDurationMs); // 等待淡出动画完成
        }, 12500);
      }
    }

    if (scheduleData.currentHighlight.type === 'current') {
      if (isClassCountdown) {
        if (isClassHidden) { // 上课 并且开启了倒计时 并且 隐藏主体 -> 显示小窗口 
          miniCountdown.innerHTML = `<div class="currentClass">${currentFullName.innerText = scheduleData.currentHighlight.fullName}</div><div class="countdown miniCountdownText">${scheduleData.currentHighlight.countdownText}</div>`
          
          toggleElement(countdownContainer, false);
          toggleElement(miniCountdown, true);
          
          // 如果迷你倒计时之前没有移动过，确保它在初始位置
          if (!miniCountdownHasMoved) {
            resetMiniCountdownPosition();
          }
        } else { // 上课 并且开启了倒计时 并且 不隐藏主体 -> 正常计时
          toggleElement(countdownContainer, true);
          toggleElement(miniCountdown, false);

          // 重置迷你倒计时位置
          resetMiniCountdownPosition();
        }
      } else { // 上课 并且关闭了倒计时 -> 都不显示
        toggleElement(countdownContainer, false);
        toggleElement(miniCountdown, false);

        // 重置迷你倒计时位置
        resetMiniCountdownPosition();
      }
    }
    else { // 下课正常显示
      toggleElement(countdownContainer, true);
      toggleElement(miniCountdown, false);

      // 重置迷你倒计时位置
      resetMiniCountdownPosition();
    }
  }

  function setCountdownerPosition() {
    let highlightElement = document.getElementById('highlighted')
    let offset = {}

    if (!highlightElement) {
      if (
        !isCountdownerPositionRetryPending &&
        scheduleData?.currentHighlight &&
        scheduleData.currentHighlight.index !== null &&
        scheduleData.currentHighlight.type
      ) {
        isCountdownerPositionRetryPending = true
        requestAnimationFrame(() => {
          isCountdownerPositionRetryPending = false
          setCountdownerPosition()
        })
      }
      return
    }

    if (scheduleData.currentHighlight.type === 'current') {
      offset = {
        x: highlightElement.offsetLeft - countdownContainer.offsetWidth / 2 + highlightElement.offsetWidth / 2,
        y: classContainer.offsetHeight
      }
    } else if (scheduleData.currentHighlight.type === 'upcoming') {
      if (scheduleData.currentHighlight.index != 0 && scheduleData.divider.indexOf((scheduleData.currentHighlight.index - 1)) != -1) {
        offset = {
          x: highlightElement.offsetLeft - countdownContainer.offsetWidth / 2 - Number(getComputedStyle(highlightElement).marginLeft.replace('px', '')) - getComputedStyle(root).getPropertyValue('--divider-width').replace('px', '') / 2 - getComputedStyle(root).getPropertyValue('--divider-margin').replace('px', ''),
          y: classContainer.offsetHeight
        }
      } else {
        offset = {
          x: highlightElement.offsetLeft - countdownContainer.offsetWidth / 2 - Number(getComputedStyle(highlightElement).marginLeft.replace('px', '')),
          y: classContainer.offsetHeight
        }
      }
    }
    if (scheduleData.currentHighlight.isEnd) {
      offset = {
        x: highlightElement.offsetLeft - countdownContainer.offsetWidth / 2 + highlightElement.offsetWidth + Number(getComputedStyle(highlightElement).marginLeft.replace('px', '')),
        y: classContainer.offsetHeight
      }
    }
  }

  // Pointer Events 拖动逻辑

  /**
   * 初始化迷你倒计时的本地与透明覆盖窗口拖动入口。
   */
  function initMiniCountdownDrag() {
    const miniCountdown = document.getElementById('miniCountdown');
    miniCountdown.addEventListener('pointerdown', handlePointerDown);
    ipcRenderer.on('mini-countdown-overlay-pointer', (event, pointerEvent) => {
      handleOverlayPointerEvent(pointerEvent);
    });
    updateInteractiveRect();
    window.addEventListener('resize', updateInteractiveRect);
  }

  /**
   * 将当前视觉矩形同步给主进程的鼠标穿透逻辑与触摸输入覆盖窗口。
   */
  function updateInteractiveRect() {
    const miniCountdown = document.getElementById('miniCountdown');
    if (miniCountdown.style.display === 'block') {
      const rect = miniCountdown.getBoundingClientRect();
      ipcRenderer.send('updateInteractiveRect', {
        x: rect.x,
        y: rect.y,
        width: rect.width,
        height: rect.height
      });
    } else {
      ipcRenderer.send('updateInteractiveRect', null);
    }
  }

  /**
   * 显示或隐藏已触及真实边界时的静态提示。
   * @param {boolean} visible 是否显示
   * @param {{x: number, y: number}|null} boundaryOrigin 实际触边的 renderer 坐标
   */
  function setDragBoundaryHintVisible(visible, boundaryOrigin = null) {
    const dragBoundaryHint = document.getElementById('dragBoundaryHint');
    if (!dragBoundaryHint) return;

    if (visible && boundaryOrigin) {
      const gradientOriginX = 25 + (boundaryOrigin.x / window.innerWidth) * 50;
      const gradientOriginY = 25 + (boundaryOrigin.y / window.innerHeight) * 50;
      dragBoundaryHint.style.setProperty('--drag-boundary-gradient-origin-x', `${gradientOriginX}%`);
      dragBoundaryHint.style.setProperty('--drag-boundary-gradient-origin-y', `${gradientOriginY}%`);
    }
    dragBoundaryHint.classList.toggle('active', visible);
  }

  /**
   * 同步迷你倒计时的拖动视觉状态。
   * @param {boolean} dragging 是否正在拖动
   */
  function setMiniCountdownDraggingState(dragging) {
    const miniCountdown = document.getElementById('miniCountdown');
    if (!miniCountdown) return;
    miniCountdown.classList.toggle('dragging', dragging);
  }

  /**
   * 开始一次迷你倒计时拖动，可选择为本地事件设置 Pointer Capture。
   * @param {number} pointerId 指针标识
   * @param {number} clientX 主课表 renderer 内的 X 坐标
   * @param {number} clientY 主课表 renderer 内的 Y 坐标
   * @param {Element|null} captureTarget 需要捕获指针的本地元素
   * @returns {boolean} 是否成功开始拖动
   */
  function startMiniCountdownDrag(pointerId, clientX, clientY, captureTarget = null) {
    const miniCountdown = document.getElementById('miniCountdown');
    if (miniCountdown.style.display !== 'block' || isDragging) return false;

    isDragging = true;
    dragPointerId = pointerId;
    dragCaptureTarget = captureTarget;
    ipcRenderer.send('setDragState', true);
    setDragBoundaryHintVisible(false);
    setMiniCountdownDraggingState(true);

    dragStartX = clientX;
    dragStartY = clientY;

    const rect = miniCountdown.getBoundingClientRect();
    miniCountdownInitialX = rect.left;
    miniCountdownInitialY = rect.top;
    miniCountdown.style.left = '0px';
    miniCountdown.style.top = '0px';
    miniCountdown.style.transform = `translate3d(${miniCountdownInitialX}px, ${miniCountdownInitialY}px, 0)`;

    if (captureTarget) {
      captureTarget.setPointerCapture(pointerId);
      captureTarget.addEventListener('pointermove', handlePointerMoveDrag);
      captureTarget.addEventListener('pointerup', handlePointerUp);
      captureTarget.addEventListener('pointercancel', handlePointerUp);
    }
    return true;
  }

  /**
   * 处理主课表内直接命中的指针按下。
   * @param {PointerEvent} event 原生指针事件
   */
  function handlePointerDown(event) {
    if (!event.isPrimary) return;
    if (startMiniCountdownDrag(event.pointerId, event.clientX, event.clientY, event.currentTarget)) {
      event.preventDefault();
    }
  }

  /**
   * 将最新拖动坐标合并到下一帧，仅更新合成层 transform。
   * @param {number} x 元素左侧的视口坐标
   * @param {number} y 元素顶部的视口坐标
   */
  function scheduleMiniCountdownPosition(x, y) {
    pendingDragPosition = { x, y };
    if (dragFrameId !== null) return;

    dragFrameId = requestAnimationFrame(() => {
      if (pendingDragPosition) {
        miniCountdown.style.transform = `translate3d(${pendingDragPosition.x}px, ${pendingDragPosition.y}px, 0)`;
      }
      dragFrameId = null;
    });
  }

  /**
   * 计算迷你倒计时在窗口边界上的实际接触点。
   * @param {number} x 夹取后的元素左侧坐标
   * @param {number} y 夹取后的元素顶部坐标
   * @param {number} width 元素宽度
   * @param {number} height 元素高度
   * @param {number} windowWidth 主课表宽度
   * @param {number} windowHeight 主课表高度
   * @returns {{x: number, y: number}} 边界接触点坐标
   */
  function getDragBoundaryOrigin(x, y, width, height, windowWidth, windowHeight) {
    const isAtLeft = x === 0;
    const isAtRight = x === windowWidth - width;
    const isAtTop = y === 0;
    const isAtBottom = y === windowHeight - height;

    return {
      x: isAtLeft ? 0 : isAtRight ? windowWidth : x + width / 2,
      y: isAtTop ? 0 : isAtBottom ? windowHeight : y + height / 2
    };
  }

  /**
   * 依据主课表 renderer 坐标更新拖动位置。
   * @param {number} clientX 主课表 renderer 内的 X 坐标
   * @param {number} clientY 主课表 renderer 内的 Y 坐标
   */
  function updateMiniCountdownDragPosition(clientX, clientY) {
    if (!isDragging) return;

    const deltaX = clientX - dragStartX;
    const deltaY = clientY - dragStartY;
    const miniCountdown = document.getElementById('miniCountdown');
    let newX = miniCountdownInitialX + deltaX;
    let newY = miniCountdownInitialY + deltaY;
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    const miniWidth = miniCountdown.offsetWidth;
    const miniHeight = miniCountdown.offsetHeight;

    newX = Math.max(0, Math.min(newX, windowWidth - miniWidth));
    newY = Math.max(0, Math.min(newY, windowHeight - miniHeight));

    const isAtBoundary = newX === 0 || newY === 0 || newX === windowWidth - miniWidth || newY === windowHeight - miniHeight;
    const boundaryOrigin = isAtBoundary
      ? getDragBoundaryOrigin(newX, newY, miniWidth, miniHeight, windowWidth, windowHeight)
      : null;
    setDragBoundaryHintVisible(isAtBoundary, boundaryOrigin);
    scheduleMiniCountdownPosition(newX, newY);
    miniCountdownHasMoved = true;
  }

  /**
   * 处理主课表内直接命中的拖动移动事件。
   * @param {PointerEvent} event 原生指针事件
   */
  function handlePointerMoveDrag(event) {
    if (!event.isPrimary || event.pointerId !== dragPointerId) return;
    updateMiniCountdownDragPosition(event.clientX, event.clientY);
    event.preventDefault();
  }

  /**
   * 结束一次迷你倒计时拖动，并只在结束时同步触摸覆盖窗口位置。
   * @param {number} pointerId 指针标识
   */
  function finishMiniCountdownDrag(pointerId) {
    if (!isDragging || pointerId !== dragPointerId) return;

    const miniCountdown = document.getElementById('miniCountdown');
    const captureTarget = dragCaptureTarget;
    isDragging = false;
    dragPointerId = null;
    dragCaptureTarget = null;
    ipcRenderer.send('setDragState', false);
    setDragBoundaryHintVisible(false);
    setMiniCountdownDraggingState(false);
    if (dragFrameId !== null) {
      cancelAnimationFrame(dragFrameId);
      dragFrameId = null;
      if (pendingDragPosition) {
        miniCountdown.style.transform = `translate3d(${pendingDragPosition.x}px, ${pendingDragPosition.y}px, 0)`;
      }
    }
    pendingDragPosition = null;
    updateInteractiveRect();

    if (captureTarget) {
      if (captureTarget.hasPointerCapture(pointerId)) {
        captureTarget.releasePointerCapture(pointerId);
      }
      captureTarget.removeEventListener('pointermove', handlePointerMoveDrag);
      captureTarget.removeEventListener('pointerup', handlePointerUp);
      captureTarget.removeEventListener('pointercancel', handlePointerUp);
    }
  }

  /**
   * 处理主课表内直接命中的拖动结束或取消事件。
   * @param {PointerEvent} event 原生指针事件
   */
  function handlePointerUp(event) {
    if (event.pointerId !== dragPointerId) return;
    finishMiniCountdownDrag(event.pointerId);
    event.preventDefault();
  }

  /**
   * 消费透明触摸覆盖窗口换算后的指针事件。
   * @param {unknown} pointerEvent 由主进程转发的可序列化指针事件
   */
  function handleOverlayPointerEvent(pointerEvent) {
    if (!pointerEvent || typeof pointerEvent !== 'object' ||
      !Number.isInteger(pointerEvent.pointerId) ||
      !Number.isFinite(pointerEvent.clientX) || !Number.isFinite(pointerEvent.clientY)) return;

    if (pointerEvent.type === 'down') {
      startMiniCountdownDrag(pointerEvent.pointerId, pointerEvent.clientX, pointerEvent.clientY);
    } else if (pointerEvent.type === 'move') {
      if (pointerEvent.pointerId === dragPointerId) {
        updateMiniCountdownDragPosition(pointerEvent.clientX, pointerEvent.clientY);
      }
    } else if (pointerEvent.type === 'up' || pointerEvent.type === 'cancel') {
      finishMiniCountdownDrag(pointerEvent.pointerId);
    }
  }


  function resetMiniCountdownPosition() {
    const miniCountdown = document.getElementById('miniCountdown');
    setDragBoundaryHintVisible(false);
    setMiniCountdownDraggingState(false);
    miniCountdown.style.left = '50%';
    miniCountdown.style.top = 'var(--top-space)';
    miniCountdown.style.transform = 'translateX(-50%)';
    miniCountdownHasMoved = false;
    updateInteractiveRect();
  }

  function setSidebar() {
    let date = getCurrentEditedDate()
    if (scheduleConfig.countdown_target === 'hidden') {
      countdownSidebar.style.display = 'none'
    } else {
      countdownSidebar.style.display = 'block'
      countdownDays.innerText = Math.ceil(Math.abs(new Date(scheduleConfig.countdown_target) - date) / (1000 * 60 * 60 * 24))
    }
  }

  function tick(reset = false) {
    scheduleData = getScheduleData();
    if (scheduleData.currentHighlight.fullName !== lastScheduleData.currentHighlight.fullName) {
      isHintShown = false;
      clearTimeout(hintTimer);
    }
    setCountdownerContent()
    if (JSON.stringify(scheduleData.scheduleArray) != JSON.stringify(lastScheduleData.scheduleArray) ||
      scheduleData.currentHighlight.index != lastScheduleData.currentHighlight.index ||
      scheduleData.currentHighlight.fullName != lastScheduleData.currentHighlight.fullName ||
      scheduleData.currentHighlight.type != lastScheduleData.currentHighlight.type || reset) {
      setScheduleClass()
      setCountdownerPosition()
      setSidebar()
      setBackgroundDisplay()
    }
    lastScheduleData = $.extend(true, {}, scheduleData)
  }

  function getNextClassInfo() {
    const currentSchedule = getCurrentDaySchedule();
    const dayOfWeek = getCurrentEditedDay(getCurrentEditedDate());
    const timetable = scheduleConfig.daily_class[dayOfWeek].timetable;
    const dayTimetable = scheduleConfig.timetable[timetable];
    const timeKeys = Object.keys(dayTimetable);
    const currentTime = getCurrentTime();

    for (let i = 0; i < timeKeys.length; i++) {
      const timeRange = timeKeys[i];
      const [startTime, endTime] = timeRange.split('-');
      const classIndex = dayTimetable[timeRange];

      if (typeof classIndex === 'number' && isClassCurrent(startTime, endTime, currentTime)) {
        for (let j = i + 1; j < timeKeys.length; j++) {
          const nextTimeRange = timeKeys[j];
          const nextClassIndex = dayTimetable[nextTimeRange];
          if (typeof nextClassIndex === 'number' && nextClassIndex < currentSchedule.length) {
            const nextSubject = currentSchedule[nextClassIndex];
            return {
              name: scheduleConfig.subject_name[nextSubject], 
              time: nextTimeRange.split('-')[0] 
            };
          }
        }
        break;
      }
    }
    return null; 
  }

  let toolbarRestoreTimer = undefined

  /**
   * 指针进入课表主体时立即隐藏工具条，并在停止移动后恢复显示。
   * @param {MouseEvent} event - 窗口转发的鼠标移动事件
   */
  function handlePointerMove(event) {
    if (miniCountdown.style.display === 'block') {
      return;
    }

    const isInsideGlobalContainer = globalContainerHitTargets.some((element) => {
      const bounds = element.getBoundingClientRect();
      return event.clientX >= bounds.left
        && event.clientX <= bounds.right
        && event.clientY >= bounds.top
        && event.clientY <= bounds.bottom;
    });

    if (!isInsideGlobalContainer) {
      return;
    }

    root.style.opacity = '0'
    clearTimeout(toolbarRestoreTimer)
    toolbarRestoreTimer = setTimeout(() => {
      root.style.opacity = '1'
    }, toolbarRestoreDelayMs);
  }

  function setScheduleDialog() {
    ipcRenderer.send('dialog', {
      reply: 'getSelectedClassIndex',
      options: {
        title: '临时更改课表',
        message: `请选择你要更改的课程序号`,
        buttons: scheduleData.scheduleArray.map((value, index) => { return `第 ${index + 1} 节: ${scheduleConfig.subject_name[value]}` }),
        cancelId: -1,
        defaultId: scheduleData.currentHighlight.index
      }
    })
  }

  /**
   * 请求主进程使用固定高度的下拉框选择替换课程。
   * @param {{index: number}} arg 课程序号对话框结果
   */
  function requestChangingClass(arg) {
    if (!Number.isInteger(arg?.index) || arg.index < 0) return

    const classes = Object.keys(scheduleConfig?.subject_name || {}).sort()
    if (classes.length === 0) {
      ipcRenderer.send('log', '[临时调课] 没有可供选择的课程')
      return
    }

    const currentClass = scheduleData?.scheduleArray?.[arg.index]
    const currentClassName = scheduleConfig.subject_name[currentClass] ?? currentClass ?? '未知课程'
    ipcRenderer.send('dialog', {
      reply: 'getSelectedChangingClass',
      index: arg.index,
      classes,
      kind: 'select',
      items: classes.map((value) => String(scheduleConfig.subject_name[value] ?? value)),
      defaultIndex: Math.max(0, classes.indexOf(currentClass)),
      options: {
        title: '更改课表',
        message: `将 第 ${arg.index + 1} 节 ${currentClassName} 更改为:`,
      }
    })
  }

  /**
   * 校验并应用课程选择结果到当天的内存课表。
   * @param {{index: number, arg: {index: number, classes: string[]}}} arg 课程选择结果
   */
  function applyChangingClass(arg) {
    if (!Number.isInteger(arg?.index) || arg.index < 0) return

    const scheduleIndex = arg?.arg?.index
    const classes = arg?.arg?.classes
    if (!Number.isInteger(scheduleIndex) || scheduleIndex < 0 || !Array.isArray(classes)) return

    const selectedClass = classes[arg.index]
    if (typeof selectedClass !== 'string') return

    const date = getCurrentEditedDate()
    const dayOfWeek = getCurrentEditedDay(date)
    const dailySchedule = scheduleConfig?.daily_class?.[dayOfWeek]
    if (!dailySchedule || !Array.isArray(dailySchedule.classList) || scheduleIndex >= dailySchedule.classList.length) return

    dailySchedule.classList[scheduleIndex] = selectedClass
  }

  ipcRenderer.on('getSelectedClassIndex', (event, arg) => requestChangingClass(arg))
  ipcRenderer.on('getSelectedChangingClass', (event, arg) => applyChangingClass(arg))

  ipcRenderer.on('openSettingDialog', (e, arg) => {
    setScheduleDialog()
  })

  ipcRenderer.on('setWeekIndex', (e, arg) => {
    scheduleConfig = JSON.parse(JSON.stringify(_scheduleConfig))
    weekIndex = arg
    localStorage.setItem('weekIndex', weekIndex.toString())
  })

  ipcRenderer.on('getWeekIndex', (e, arg) => {
    ipcRenderer.send('getWeekIndex', getCurrentWeekIndex(getCurrentEditedDate()))
  })

  ipcRenderer.on('getTimeOffset', (e, arg) => {
    let offset = localStorage.getItem('timeOffset');
    ipcRenderer.send('getTimeOffset', offset === null ? 0 : Number(offset))
  })

  ipcRenderer.on('setTimeOffset', (e, arg) => {
    timeOffset = arg
    localStorage.setItem('timeOffset', arg.toString())
  })

  ipcRenderer.on('ClassCountdown', (e, arg) => {
    isClassCountdown = arg
    tick(reset = true)
  })

  ipcRenderer.on('ClassHidden', (e, arg) => {
    isClassHidden = arg
    tick(reset = true)
  })

  ipcRenderer.on('setDayOffset', (e, arg) => {
    ipcRenderer.send('dialog', {
      reply: 'getDayOffset',
      options: {
        title: '切换日程',
        message: `将今日使用课表日程设置为本周的星期几：`,
        buttons: ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '重置至当前日期'],
        cancelId: -1,
      }
    })
  })

  ipcRenderer.on('getDayOffset', (e, arg) => {
    if (arg.index == -1) return
    if (arg.index <= 6) {
      localStorage.setItem('dayOffset', arg.index.toString())
      localStorage.setItem('setDayOffsetLastDay', new Date().getDay().toString())
      dayOffset = arg.index
      setDayOffsetLastDay = new Date().getDay()
      return
    }
    localStorage.setItem('dayOffset', '-1')
    localStorage.setItem('setDayOffsetLastDay', '-1')
    dayOffset = -1
    setDayOffsetLastDay = -1
  })

  /**
   * 使用主进程校验通过的课表配置启动页面。
   * @param {Object} loadedScheduleConfig - 已校验的课表配置
   */
  function startSchedulePage(loadedScheduleConfig) {
    _scheduleConfig = JSON.parse(JSON.stringify(loadedScheduleConfig))
    scheduleConfig = JSON.parse(JSON.stringify(loadedScheduleConfig))
    scheduleData = getScheduleData()

    for (const key in scheduleConfig.css_style) {
      root.style.setProperty(key, scheduleConfig.css_style[key])
    }

    tick(true)
    initMiniCountdownDrag()
    window.addEventListener('mousemove', handlePointerMove)
    ipcRenderer.send('setIgnore', true)

    let lastTickTime = new Date().getTime()
    setInterval(() => {
      if (new Date().getTime() - lastTickTime >= 1000) {
        lastTickTime = new Date().getTime()
        tick()
      }
    }, 20)
  }

  window.startSchedulePage = startSchedulePage
</script>

</html>
