name: 构建并发布 Electron 应用

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 启用 Corepack
        run: corepack enable

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: 验证锁文件
        shell: pwsh
        run: |
          if (!(Test-Path yarn.lock)) {
            Write-Error "yarn.lock not found. Please commit your lockfile."
            exit 1
          }

      - name: 安装依赖
        run: corepack yarn install --frozen-lockfile

      - name: 构建 Electron 应用
        run: corepack yarn build

      - name: 提取发布元数据
        id: meta
        shell: pwsh
        run: |
          $pkgVersion = node -p "require('./package.json').version"
          $inputVersion = "${{ github.event.inputs.version }}"

          if ([string]::IsNullOrWhiteSpace($inputVersion)) {
            $cleanVersion = $pkgVersion
          } else {
            $cleanVersion = $inputVersion.TrimStart('v')
          }

          $tag = "v$cleanVersion"

          "VERSION=$cleanVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NAME=Release $tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 验证构建输出
        shell: pwsh
        run: |
          Write-Host "📦 正在检查构建输出..."
          Get-ChildItem -Path out -Force

          $exeFiles = Get-ChildItem -Path out -Filter *.exe -ErrorAction SilentlyContinue
          $ymlFiles = Get-ChildItem -Path out -Filter *.yml -ErrorAction SilentlyContinue
          $blockmapFiles = Get-ChildItem -Path out -Filter *.blockmap -ErrorAction SilentlyContinue

          if (-not $exeFiles) {
            Write-Error "❌ 未找到 .exe 文件"
            exit 1
          }
          if (-not $ymlFiles) {
            Write-Warning "⚠️ 未找到 .yml 文件（自动更新可能无法工作）"
          }
          if (-not $blockmapFiles) {
            Write-Warning "⚠️ 未找到 .blockmap 文件（自动更新可能无法工作）"
          }

          Write-Host "✅ 构建产物已就绪"

      - name: 创建 GitHub 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ## 📦 构建信息

            | 项目 | 值 |
            |------|------|
            | 版本 | `${{ env.VERSION }}` |
            | 提交 | `${{ github.sha }}` |
            | 触发方式 | `${{ github.event_name }}` |

            ## ⚠️ 签名状态

            当前版本 **未进行代码签名**，Windows SmartScreen 可能会提示"未知发布者"。
            这是正常现象，点击"仍要运行"即可安装。

            ## 📝 更新内容

            详见 [Commits](https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }})

            ---
            *由 GitHub Actions 自动生成*
          draft: false
          prerelease: false
          files: |
            out/*.exe
            out/*.yml
            out/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}