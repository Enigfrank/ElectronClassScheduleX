name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.4.2)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Verify lockfile
        run: |
          if (!(Test-Path package-lock.json)) {
            Write-Error "package-lock.json not found. Please commit your lockfile."
            exit 1
          }
        shell: pwsh

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Rebuild native modules
        run: npx electron-rebuild
        shell: bash

      - name: Build Electron App
        run: npm run build
        shell: bash

      - name: Extract version
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "productVersion=$VERSION" >> $GITHUB_ENV

      - name: Verify build output
        run: |
          echo "📦 Checking build outputs..."
          ls -la out/
          if [ ! -f out/*.exe ]; then
            echo "❌ No .exe found"
            exit 1
          fi
          if [ ! -f out/*.yml ]; then
            echo "⚠️ No .yml found (auto-update may not work)"
          fi
          if [ ! -f out/*.blockmap ]; then
            echo "⚠️ No .blockmap found (auto-update may not work)"
          fi
          echo "✅ Build artifacts ready"
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 📦 构建信息

            | 项目 | 值 |
            |------|------|
            | 版本 | `${{ env.VERSION }}` |
            | 提交 | `${{ github.sha }}` |
            | 构建时间 | `${{ github.event.head_commit.timestamp }}` |
            | 触发方式 | `${{ github.event_name }}` |

            ## ⚠️ 签名状态

            当前版本 **未进行代码签名**，Windows SmartScreen 可能会提示"未知发布者"。
            这是正常现象，点击"仍要运行"即可安装。

            ## 📝 更新内容

            详见 [Commits](https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }})

            ---
            *Automatically generated by GitHub Actions*
          draft: false
          prerelease: false
          files: |
            out/*.exe
            out/*.yml
            out/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}